<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>マイちゃんのダイエット</title>
<meta name="description" content="恐竜のマイちゃんがジャンプして、転がってくるものをよけ続ける全10ステージのミニゲーム">
<meta name="theme-color" content="#3B5512">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マイちゃん">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* layout: one centered play stage, title above, how-to chips below */
:root {
  --page: #E4F0EC;
  --ink: #23401A;
  --ink-soft: #4F6A44;
  --leaf: #6B8B2A;
  --leaf-deep: #3B5512;
  --card: #FFFFFF;
  --chip: #D3E6C2;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.wrap { max-width: 1100px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.tapzone {
  flex: 1 1 auto; min-height: 0; display: none; align-items: center; justify-content: center; text-align: center;
  border: 2px dashed var(--leaf); border-radius: 18px; color: var(--ink-soft); font-size: 15px; padding: 12px;
}
.rotate { font-size: 13px; color: var(--ink-soft); }
.sound.float { position: absolute; right: 10px; bottom: 10px; z-index: 2; font-size: 13px; padding: 3px 12px; }
@media (pointer: coarse) and (orientation: portrait) {
  .tapzone { display: flex; flex-direction: column; gap: 6px; }
  .howto { display: none !important; }
  .sound.float { font-size: 11px; padding: 1px 9px; right: 6px; bottom: 4px; border-width: 1.5px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  header, .howto, .tapzone { display: none !important; }
  html, body { height: auto !important; }
  .wrap { gap: 0 !important; max-width: none !important; height: auto !important; }
  body {
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px) !important;
    overflow: hidden;
  }
  .stage { border-width: 0 !important; border-radius: 0 !important; }
}
header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(22px, 4.2vw, 32px); margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.best { font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.tools { display: flex; align-items: center; gap: 12px; }
.sound { font-family: var(--font-body); font-weight: 700; font-size: 14px; color: var(--ink); background: var(--card); border: 2px solid var(--leaf-deep); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.sound[aria-pressed="false"] { background: var(--chip); color: var(--ink-soft); }
.sound:focus-visible { outline: 3px solid #1D9E75; outline-offset: 2px; }
.stage {
  position: relative; border-radius: 18px; overflow: hidden; box-sizing: border-box; align-self: center; max-width: 100%;
  border: 3px solid var(--leaf-deep); background: #CDE8F6;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer;
}
.stage:focus-visible { outline: 3px solid #1D9E75; outline-offset: 3px; }
canvas { display: block; width: 100%; }
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.panel {
  background: rgba(255,255,255,0.92); border: 2px solid var(--leaf-deep); border-radius: 16px;
  padding: 14px 22px; text-align: center; display: flex; flex-direction: column; gap: 4px;
  max-width: 86%;
}
.panel .big { font-family: var(--font-display); font-weight: 900; font-size: clamp(18px, 3.6vw, 28px); }
.panel .score { font-size: clamp(15px, 2.6vw, 20px); font-variant-numeric: tabular-nums; font-weight: 700; }
.panel .hint { font-size: clamp(12px, 2.2vw, 15px); color: var(--ink-soft); }
.modes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 6px 0 2px; pointer-events: auto; }
.mode { font-family: var(--font-display); font-weight: 900; font-size: clamp(14px, 2.6vw, 19px); border-radius: 14px; padding: 6px 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.2; border: 3px solid; }
.mode small { font-family: var(--font-body); font-weight: 700; font-size: 0.62em; opacity: 0.85; }
.mode.easy { background: #DDF1C6; color: #2F5A12; border-color: #5E9A2C; }
.mode.normal { background: #FFF1B8; color: #6B4E00; border-color: #D3A21A; }
.mode.hard { background: #FFD6CF; color: #8A1E12; border-color: #D9503C; }
.mode.practice { background: #D6ECFA; color: #164A6E; border-color: #3E8DC8; }
.sound.float.quit { right: auto; left: 10px; }
.pausebtn { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 2; font-family: var(--font-body); font-weight: 700; font-size: 13px; color: var(--ink); background: rgba(255,255,255,0.88); border: 2px solid var(--leaf-deep); border-radius: 999px; padding: 2px 16px; cursor: pointer; }
.nextbtn { position: absolute; left: 50%; top: 66%; transform: translateX(-50%); z-index: 3; font-family: var(--font-display); font-weight: 900; font-size: clamp(12px, 2.6vw, 22px); color: #6B4E00; background: #FFF1B8; border: 2.5px solid #D3A21A; border-radius: 0.8em; padding: 0.3em 1.1em; cursor: pointer; box-shadow: 0 3px 0 #B88A00; animation: nextpulse 1.1s ease-in-out infinite; white-space: nowrap; }
.nextbtn:focus-visible { outline: 3px solid #1D9E75; outline-offset: 2px; }
@keyframes nextpulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.06); } }
.pausebtn:focus-visible { outline: 3px solid #1D9E75; outline-offset: 2px; }
.mode:hover { filter: brightness(1.04); transform: translateY(-1px); }
.medalrow { display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; margin: 4px 0 0; font-size: 12px; font-weight: 700; color: var(--ink-soft); pointer-events: auto; }
.medal { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; border: 2px solid #B9C4B0; color: #8A9682; background: #F4F6F0; font-variant-numeric: tabular-nums; }
.medal.m1 { background: #E3A46E; border-color: #9C5B26; color: #5A3210; }
.medal.m2 { background: #E4E8EE; border-color: #8C96A3; color: #3E4752; }
.medal.m3 { background: #FFD84D; border-color: #B88A00; color: #6B4E00; box-shadow: 0 0 6px rgba(255,200,40,0.8); }
/* long-press anywhere must not select text or pop up the copy menu (it gets in the way of big jumps) */
html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.overlay[hidden], .pvbox[hidden] { display: none !important; }
/* upright phone: menus go in a roomy area under the game picture, so the text stays big and Mai-chan stays whole */
/* the game box never gets squeezed shorter than its menu (a short phone screen used to cut the bottom off) */
.stage { flex-shrink: 0; }
.stage.tall .overlay { position: static; inset: auto; padding: 10px 8px 12px; background: linear-gradient(#A8D27E, #8CBF62); border-top: 3px solid var(--leaf-deep); }
.stage.tall .panel { max-width: 100%; width: 100%; box-sizing: border-box; padding: 12px 10px; }
.pvbtn { background: #FFF1B8 !important; color: #6B4E00 !important; border-color: #D3A21A !important; }
.pvbox { position: absolute; inset: 0; z-index: 5; background: rgba(10,14,20,0.92); display: flex; align-items: center; justify-content: center; }
.pvbox video { max-width: 100%; max-height: 100%; }
.pvbox .close { position: absolute; top: 8px; right: 10px; z-index: 6; }
.wearbtn { font-family: var(--font-display); font-weight: 900; font-size: 13px; border-radius: 12px; padding: 3px 12px; cursor: pointer; border: 2px solid #B05C9A; background: #FBE1F2; color: #7A2763; margin-left: 6px; }
.wardrobe { display: flex; flex-direction: column; gap: 5px; text-align: left; pointer-events: auto; }
.wardrobe .row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.wardrobe .lab { font-weight: 900; font-size: 13px; min-width: 6.5em; color: var(--ink); }
.chip { font-family: var(--font-body); font-weight: 700; font-size: 12px; border-radius: 10px; padding: 3px 9px; cursor: pointer; border: 2px solid var(--leaf-deep); background: #FFFFFF; color: var(--ink); display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2; }
.chip.on { background: #FFE58A; border-color: #B88A00; }
.chip[disabled] { cursor: default; border-style: dashed; color: #8A9682; background: #F1F3EE; }
.chip small { font-weight: 500; font-size: 0.8em; }
.wardrobe .foot { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 2px; }
.wtabs { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 2px 0 4px; }
.wtab { font-family: var(--font-display); font-weight: 900; font-size: 13px; border-radius: 10px 10px 4px 4px; padding: 4px 10px; cursor: pointer; border: 2px solid var(--leaf-deep); background: #EEF3E8; color: var(--ink-soft); display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.wtab small { font-family: var(--font-body); font-weight: 700; font-size: 0.72em; }
.wtab.on { background: #FFE58A; border-color: #B88A00; color: #6B4E00; }
.wgrid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 64px; align-content: flex-start; }
.wgrid .chip { font-size: 14px; padding: 5px 11px; }
.chip.lock img { display: block; height: 30px; max-width: 64px; margin: 0 auto 1px; object-fit: contain; }
.rankbox { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 6px; pointer-events: auto; }
.rankbox input { font-family: var(--font-body); font-weight: 700; font-size: 15px; width: 9em; padding: 5px 9px; border: 2px solid var(--leaf-deep); border-radius: 10px; background: #FFFFFF; color: #23401A; color-scheme: light; -webkit-user-select: text; user-select: text; }
.rankbox .mode { font-size: 15px; padding: 5px 12px; }
.rankgift { width: 100%; font-size: 13px; font-weight: 900; color: #8A6410; background: #FFF4C2; border: 2px dashed #D3A21A; border-radius: 10px; padding: 3px 8px; line-height: 1.45; }
.rankgift small { font-weight: 700; color: #6B4E00; }
.rankmsg { width: 100%; font-size: 13px; font-weight: 700; color: #B4501F; min-height: 1.2em; }
.ranklist { min-width: 15em; margin: 6px auto 4px; border-collapse: collapse; font-size: 15px; }
.ranklist td { padding: 3px 8px; border-bottom: 1px solid #D5E2CC; text-align: left; }
.ranklist td { white-space: nowrap; }
.ranklist td.r { font-weight: 900; width: 3em; text-align: center; }
.ranklist td.s { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.ranklist tr.top1 td.r { color: #B88A00; } .ranklist tr.top2 td.r { color: #6F7A86; } .ranklist tr.top3 td.r { color: #9C5B26; }
.rankbtn { background: #E6F3FF !important; color: #164A6E !important; border-color: #3E8DC8 !important; }
.wpage { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.wpage button { font-family: var(--font-display); font-weight: 900; font-size: 14px; border-radius: 10px; padding: 2px 12px; cursor: pointer; border: 2px solid var(--leaf-deep); background: #FFFFFF; color: var(--ink); }
.wpage button[disabled] { opacity: 0.35; cursor: default; }
.challenge { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 4px; pointer-events: auto; }
.mode:focus-visible { outline: 3px solid #1D9E75; outline-offset: 2px; }
.panel .new { color: #B4501F; font-weight: 700; font-size: 14px; }
.howto { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; }
.howto span { background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 12px; }
kbd { font-family: var(--font-body); font-weight: 700; background: var(--card); border: 1px solid var(--leaf); border-radius: 6px; padding: 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>マイちゃんのダイエット</h1>
    <div class="best" id="bestTop">ハイスコア 0</div>
  </header>

  <div class="stage" id="stage" tabindex="0" aria-label="マイちゃんのダイエットのゲーム画面。スペースキーかタップでジャンプ">
    <canvas id="game"></canvas>
    <button type="button" class="sound float" id="sound" aria-pressed="true">音：オン</button>
    <button type="button" class="pausebtn" id="pauseBtn" hidden>きゅうけい</button>
    <button type="button" class="nextbtn" id="nextBtn" hidden>つぎにすすむ ▶</button>
    <div class="pvbox" id="pvBox" hidden><video id="pvVideo" playsinline controls preload="none"></video><button type="button" class="sound close" id="pvClose">とじる</button></div>
    <button type="button" class="sound float quit" id="quitPractice" hidden>れんしゅうをおわる</button>
    <div class="overlay" id="overlay">
      <div class="panel" id="panel">
        <div class="big">マイちゃんのダイエット</div>
        <div class="hint">ころころ転がってくるものを よけてね</div>
        <div class="modes">
          <button type="button" class="mode easy" data-mode="easy">かんたん<small>のこり5回</small></button>
          <button type="button" class="mode normal" data-mode="normal">ふつう<small>のこり3回</small></button>
          <button type="button" class="mode hard" data-mode="hard">むずかしい<small>のこり1回</small></button>
        </div>
        <div class="modes">
          <button type="button" class="mode practice" data-mode="practice">ジャンプれんしゅう<small>小・中・大ジャンプ／何回あたってもOK</small></button>
        </div>
        <div class="hint">ボタンか、キーボードの <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> でえらんでね</div>
        <div class="medalrow" id="medalRow"></div>
      </div>
    </div>
  </div>

  <div class="tapzone" id="tapzone">
    <div>ここをタップしてもジャンプできます</div>
    <div class="rotate">横向きにすると、同じ画面が大きくなります</div>
  </div>

  <div class="howto">
    <span><kbd>スペース</kbd> / タップ でジャンプ</span>
    <span>長押しすると少し高く跳べます</span>
    <span>決められた数をよけきるとステージクリア</span>
    <span>緑の「1UP」に当たるとのこり＋1</span>
    <span>高く飛んでくる弾は、跳ばずにやりすごそう</span>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const bestTop = document.getElementById('bestTop');
  const soundBtn = document.getElementById('sound');

  const H = 300;            // logical height
  let W = 800;              // logical width (depends on screen)
  const GROUND = 252;       // ground line y
  const DINO_X = 40;
  const S = 0.44;           // dino scale
  const FONT = '"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif';

  // ---- sound (made in the page, no audio files) ----
  let actx = null, master = null, muted = false;
  try { muted = localStorage.getItem('pottori-dino-muted') === '1'; } catch (e) {}
  function paintSoundBtn() {
    soundBtn.textContent = muted ? '音：オフ' : '音：オン';
    soundBtn.setAttribute('aria-pressed', muted ? 'false' : 'true');
    const pz = document.querySelector('[data-pz="snd"]');
    if (pz) pz.textContent = muted ? '音：オフ' : '音：オン';
  }
  paintSoundBtn();
  function toggleSound() {
    muted = !muted;
    try { localStorage.setItem('pottori-dino-muted', muted ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.6, actx.currentTime, 0.02);
    paintSoundBtn();
  }
  soundBtn.addEventListener('click', () => { toggleSound(); soundBtn.blur(); });
  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(actx.destination);
    } catch (e) { actx = null; }
  }
  function tone(freq, t, dur, type, vol, slideTo) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  let noiseBuf = null;
  function noise(t, dur, vol, filterType, freq) {
    if (!actx) return;
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 1.0), actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; f.type = filterType; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  }
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const now = () => (actx ? actx.currentTime : 0);
  const sfx = {
    jump() { tone(330, now(), 0.2, 'sine', 0.35, 780); },
    land() { tone(170, now(), 0.1, 'triangle', 0.3, 90); },
    landM() { const t = now();
      tone(165, t, 0.16, 'triangle', 0.42, 75); tone(115, t, 0.16, 'sine', 0.28, 55);
      noise(t, 0.12, 0.12, 'lowpass', 700); },
    landL() { const t = now();   // "ボスン": a soft heavy plop with a little springy bounce
      tone(130, t, 0.32, 'sine', 0.6, 42); tone(210, t, 0.22, 'triangle', 0.38, 80);
      noise(t, 0.28, 0.28, 'lowpass', 520);
      tone(330, t + 0.11, 0.13, 'sine', 0.16, 470); tone(260, t + 0.2, 0.1, 'sine', 0.08, 360); },
    chime() { const t = now(); tone(1047, t, 0.09, 'square', 0.1); tone(1568, t + 0.09, 0.18, 'square', 0.1); },
    miss() { const t = now(); tone(523, t, 0.7, 'triangle', 0.32, 110); tone(392, t + 0.06, 0.65, 'sine', 0.18, 82); },
    over() { const t = now(); [67, 64, 60, 55].forEach((m, i) => tone(mtof(m), t + i * 0.22, 0.3, 'triangle', 0.25)); },
    clear() { const t = now(); [67, 71, 74, 79, 83, 86].forEach((m, i) => tone(mtof(m), t + i * 0.09, i === 5 ? 0.5 : 0.14, 'square', 0.09)); },
    ending() { const t = now(); [72, 76, 79, 84, 79, 84, 88].forEach((m, i) => tone(mtof(m), t + i * 0.14, i === 6 ? 0.9 : 0.2, 'square', 0.09)); },
    oneup() { const t = now(); [76, 79, 88, 84, 86, 91].forEach((m, i) => tone(mtof(m), t + i * 0.07, 0.12, 'square', 0.09)); },
    boom() { const t = now(); noise(t, 0.6, 0.6, 'lowpass', 900); tone(110, t, 0.4, 'sine', 0.5, 40); },
    tick() { tone(1800, now(), 0.03, 'square', 0.05); },
    zap() { const t = now(); tone(2200, t, 0.18, 'sawtooth', 0.06, 500); noise(t, 0.2, 0.18, 'highpass', 2500); },
    shot() { tone(1400, now(), 0.16, 'square', 0.08, 300); noise(now(), 0.08, 0.15, 'highpass', 3000); },
    fall() { tone(1500, now(), 0.6, 'sine', 0.08, 420); },
    thud() { tone(120, now(), 0.15, 'sine', 0.35, 50); },
    pop() { tone(420, now(), 0.12, 'square', 0.07, 980); },
    thunder() { noise(now(), 1.3, 0.35, 'lowpass', 300); },
  };
  // ---- BGM instruments: the same notes, played with real-instrument-like sounds instead of beeps ----
  let pianoWave = null;
  function envGain(t, a, peak, dur, rel) {

  // hit circles in dino-local coords (slightly forgiving)
  const HIT = [ [150, 255, 70], [250, 135, 50], [245, 270, 55] ];

  // ---- obstacles: many round things, different sizes and speeds ----
  // mult = speed vs. the ground (1 = rolls with the scenery)
  const KINDS = [
    { name: 'rock',   rMin: 16, rMax: 30, mult: 1.0 },
    { name: 'basket', rMin: 19, rMax: 23, mult: 1.05 },
    { name: 'soccer', rMin: 14, rMax: 16, mult: 1.15 },
    { name: 'baseball', rMin: 9, rMax: 10, mult: 1.6 },
    { name: 'volley', rMin: 15, rMax: 17, mult: 1.0 },
    { name: 'suika',  rMin: 20, rMax: 30, mult: 0.95 },
    { name: 'melon',  rMin: 18, rMax: 26, mult: 1.0 },
    { name: 'mikan',  rMin: 10, rMax: 14, mult: 1.25 },
    { name: 'earth',  rMin: 22, rMax: 32, mult: 0.9 },
    { name: 'saturn', rMin: 16, rMax: 22, mult: 0.95 },
    { name: 'iron',   rMin: 14, rMax: 24, mult: 1.35 },

  function roundBody(r, fill, line) {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);

  function clipCircle(r) { ctx.beginPath(); ctx.arc(0, 0, r - 1, 0, Math.PI * 2); ctx.clip(); }

  function drawObstacle(o) {
    const r = o.r, n = o.kind.name;
    ctx.save();
    ctx.translate(o.x, GROUND - r - o.h);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // saturn's ring stays level: back half first
    if (n === 'saturn') {
      ctx.strokeStyle = '#B98A3E'; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.75, r * 0.45, -0.25, Math.PI, Math.PI * 2); ctx.stroke();
    }

    ctx.save();
    ctx.rotate(o.a);
    if (n === 'rock') {
      roundBody(r, '#8D8B83', '#5B5A55');
      ctx.strokeStyle = '#5B5A55'; ctx.lineWidth = 2.5; ctx.beginPath();
      ctx.moveTo(-r * 0.5, -r * 0.3); ctx.quadraticCurveTo(0, -r * 0.55, r * 0.4, -r * 0.2);
      ctx.moveTo(-r * 0.3, r * 0.35); ctx.quadraticCurveTo(r * 0.1, r * 0.5, r * 0.45, r * 0.25);
      ctx.stroke();
    } else if (n === 'ball') {
      roundBody(r, '#E0663A', '#9A3D1C');
      ctx.strokeStyle = '#FFF4E8'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-r + 2, 0); ctx.lineTo(r - 2, 0); ctx.stroke();
      ctx.strokeStyle = '#9A3D1C'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
    } else if (n === 'basket') {
      roundBody(r, '#E8782A', '#7A3A10');
      ctx.strokeStyle = '#3A1E0C'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(-r * 1.25, 0, r * 0.95, -0.75, 0.75); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 1.25, 0, r * 0.95, Math.PI - 0.75, Math.PI + 0.75); ctx.stroke();
    } else if (n === 'soccer') {
      roundBody(r, '#FFFFFF', '#2B2B2B');
      ctx.save(); clipCircle(r);
      ctx.fillStyle = '#2B2B2B';
      const pent = (cx, cy, s) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; const px = cx + Math.cos(a) * s, py = cy + Math.sin(a) * s; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.closePath(); ctx.fill(); };
      pent(0, 0, r * 0.36);
      for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; pent(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95, r * 0.3); }
      ctx.strokeStyle = '#2B2B2B'; ctx.lineWidth = 1.4;
      for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.36, Math.sin(a) * r * 0.36); ctx.lineTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7); ctx.stroke(); }
      ctx.restore();
    } else if (n === 'baseball') {
      roundBody(r, '#FBFAF4', '#9A9A90');
      ctx.strokeStyle = '#D6372B'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(-r * 1.15, 0, r * 0.85, -0.85, 0.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 1.15, 0, r * 0.85, Math.PI - 0.85, Math.PI + 0.85); ctx.stroke();
    } else if (n === 'volley') {
      roundBody(r, '#FFFFFF', '#3A5A8C');
      ctx.save(); clipCircle(r);
      ctx.lineWidth = r * 0.42;
      ctx.strokeStyle = '#F2C230'; ctx.beginPath(); ctx.arc(-r * 0.9, -r * 0.9, r * 1.25, 0, Math.PI / 2); ctx.stroke();
      ctx.strokeStyle = '#2F6FC0'; ctx.beginPath(); ctx.arc(r * 0.95, r * 0.2, r * 1.0, Math.PI * 0.9, Math.PI * 1.45); ctx.stroke();
      ctx.strokeStyle = '#F2C230'; ctx.beginPath(); ctx.arc(-r * 0.2, r * 1.2, r * 0.95, Math.PI * 1.25, Math.PI * 1.85); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = '#3A5A8C'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    } else if (n === 'suika') {
      roundBody(r, '#4E9A3E', '#2C5E22');
      ctx.save(); clipCircle(r);
      ctx.strokeStyle = '#1F4A17'; ctx.lineWidth = 3.2;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        for (let k = -10; k <= 10; k++) {
          const yy = (k / 10) * r, xx = i * r * 0.38 + Math.sin(k * 1.3) * 2.2;

      ctx.restore();
    } else if (n === 'melon') {
      roundBody(r, '#BCD37E', '#7E9440');
      ctx.save(); clipCircle(r);
      ctx.strokeStyle = '#EEF4D6'; ctx.lineWidth = 1.6;
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath(); ctx.moveTo(-r, i * r * 0.32 - r * 0.4); ctx.quadraticCurveTo(0, i * r * 0.32 + r * 0.15, r, i * r * 0.32 - r * 0.2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(i * r * 0.32 - r * 0.3, -r); ctx.quadraticCurveTo(i * r * 0.32 + r * 0.2, 0, i * r * 0.32 - r * 0.1, r); ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = '#6B5A2E'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(-3, -r - 6); ctx.lineTo(4, -r - 8); ctx.stroke();
    } else if (n === 'mikan') {
      roundBody(r, '#F39A1E', '#B4640C');
      ctx.fillStyle = '#D9800F';
      for (let i = 0; i < 6; i++) { const a = i * 1.05; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55, 1.2, 0, Math.PI * 2); ctx.fill(); }

      ctx.beginPath(); ctx.ellipse(0, -r + 1, 4, 2.2, 0.4, 0, Math.PI * 2); ctx.fill();
    } else if (n === 'earth') {
      roundBody(r, '#3E8ED0', '#1F5C93');
      ctx.save(); clipCircle(r);
      ctx.fillStyle = '#5DB04A';
      const blob = (x, y, rx, ry, rot) => { ctx.beginPath(); ctx.ellipse(x * r, y * r, rx * r, ry * r, rot, 0, Math.PI * 2); ctx.fill(); };
      blob(-0.35, -0.3, 0.38, 0.26, 0.4); blob(-0.2, 0.15, 0.2, 0.32, -0.3);
      blob(0.45, -0.05, 0.25, 0.4, 0.2); blob(0.3, 0.55, 0.3, 0.15, 0);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      blob(-0.1, -0.85, 0.5, 0.14, 0); blob(0.1, 0.88, 0.45, 0.12, 0);

      roundBody(r, '#77695A', '#3E352B');

      ctx.strokeStyle = '#4C4237'; ctx.lineWidth = 1.8;
      for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.arc(i * r * 0.3 - r * 1.2, 0, r * 1.2, -0.9, 0.9); ctx.stroke(); }
      ctx.restore();

      g.addColorStop(0, 'rgba(255,255,255,0.42)'); g.addColorStop(0.35, 'rgba(255,255,255,0.08)');

  // ---- special things: bullet, bomb, 1UP ----
  function drawThunder(o) {
    if (o.warn > 0 && o.zip) {
      const on = Math.floor(o.warn * 10) % 2 === 0;
      ctx.save(); ctx.translate(o.dir > 0 ? 26 : W - 26, GROUND - 22);
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fillStyle = on ? '#FFD23F' : '#FFF0A8'; ctx.fill();
      ctx.strokeStyle = '#B88A00'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#7A4F00'; ctx.beginPath();
      ctx.moveTo(2, -11); ctx.lineTo(-6, 2); ctx.lineTo(0, 2); ctx.lineTo(-3, 11); ctx.lineTo(7, -3); ctx.lineTo(1, -3); ctx.closePath(); ctx.fill();
      ctx.restore();
      return;
    }
    if (o.warn > 0) {
      // warning: a flashing lightning mark where it will fall, and a dotted drop line
      const on = Math.floor(o.warn * 10) % 2 === 0;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,210,40,0.6)'; ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.moveTo(o.x, 100); ctx.lineTo(o.x, GROUND - 4); ctx.stroke(); ctx.setLineDash([]);
      ctx.translate(o.x, 82);
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fillStyle = on ? '#FFD23F' : '#FFF0A8'; ctx.fill();
      ctx.strokeStyle = '#B88A00'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#7A4F00'; ctx.beginPath();
      ctx.moveTo(2, -11); ctx.lineTo(-6, 2); ctx.lineTo(0, 2); ctx.lineTo(-3, 11); ctx.lineTo(7, -3); ctx.lineTo(1, -3); ctx.closePath(); ctx.fill();
      ctx.restore();
      return;
    }
    const cy = GROUND - o.r - o.h, tt = performance.now() / 1000;
    ctx.save();
    // tail of light while falling or zipping
    ctx.strokeStyle = 'rgba(255,230,90,0.45)'; ctx.lineWidth = o.r * 1.2; ctx.lineCap = 'round';
    ctx.beginPath();
    if (o.zip) { ctx.moveTo(o.x, cy); ctx.lineTo(o.x - 70 * (o.dir || -1), cy); } else { ctx.moveTo(o.x, cy); ctx.lineTo(o.x + 20, cy - 70); }
    ctx.stroke();
    ctx.translate(o.x, cy);
    ctx.beginPath(); ctx.arc(0, 0, o.r * 1.9, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,240,120,0.35)'; ctx.fill();

    ctx.strokeStyle = '#FFE14D'; ctx.lineWidth = 2.5;
    for (let k = 0; k < 6; k++) {
      const a = k * Math.PI / 3 + tt * 9 + Math.sin(tt * 40 + k);
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * o.r, Math.sin(a) * o.r);
      ctx.lineTo(Math.cos(a + 0.25) * o.r * 1.5, Math.sin(a + 0.25) * o.r * 1.5);
      ctx.lineTo(Math.cos(a - 0.1) * o.r * 1.9, Math.sin(a - 0.1) * o.r * 1.9); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, o.r, 0, Math.PI * 2); ctx.fillStyle = '#FFD21F'; ctx.fill();
    ctx.strokeStyle = '#E09400'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(-2, -2, o.r * 0.5, 0, Math.PI * 2); ctx.fillStyle = '#FFFBE0'; ctx.fill();
    ctx.restore();
  }

  function drawBullet(o) {
    const cy = GROUND - o.h;
    if (o.warn > 0) {
      // warning mark at the right edge
      const on = Math.floor(o.warn * 10) % 2 === 0;
      ctx.save();
      ctx.translate(o.dir > 0 ? 26 : W - 26, cy);
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2);
      ctx.fillStyle = on ? '#E2462F' : '#F6A38F'; ctx.fill();

  function drawBomb(o) {
    const r = o.r, cy = GROUND - r - o.h;
    if (o.boom > 0) {
      const k = Math.min(1, o.boom / 0.12), R = o.blast * k;
      const fade = Math.max(0, 1 - Math.max(0, o.boom - 0.2) / 0.25);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(o.x, cy);
      ctx.fillStyle = '#F7C948';
      ctx.beginPath();
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2, rr = i % 2 ? R * 0.72 : R * 1.08;
        i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
      circ(0, 0, R * 0.7, '#F08A2C');
      circ(0, 0, R * 0.4, '#FFF1C2');
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.translate(o.x, cy);
    ctx.save();
    ctx.rotate(o.a);
    const blink = o.lit && Math.floor(o.t * (o.fuse < 0.6 ? 16 : 8)) % 2 === 0;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = blink ? '#B8322A' : '#2B2B30'; ctx.fill();
    ctx.strokeStyle = '#111114'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#55555C';
    ctx.save(); ctx.rotate(0.6); ctx.fillRect(-5, -r - 6, 10, 8); ctx.restore();
    ctx.strokeStyle = '#8A6A3A'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    const fx = Math.sin(0.6) * (r + 6), fy = -Math.cos(0.6) * (r + 6);
    ctx.beginPath(); ctx.moveTo(fx, fy); ctx.quadraticCurveTo(fx + 10, fy - 4, fx + 8, fy - 12); ctx.stroke();
    if (o.lit) {
      const sp = 4 + Math.sin(o.t * 40) * 2;
      ctx.fillStyle = '#FFD23F';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2, rr = i % 2 ? sp * 0.4 : sp;
        const px = fx + 8 + Math.cos(a) * rr, py = fy - 12 + Math.sin(a) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.4, r * 0.26, r * 0.14, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function maiFace() {
    // round front face (approved sample): sleepy left eye, open right eye, red bow tie
    const LW = 3.5, L = '#3B5512';

    ctx.beginPath(); ctx.ellipse(0, 26, 50, 30, 0, 0, Math.PI * 2); ctx.fillStyle = '#7E9E3A'; ctx.fill();

    ctx.beginPath(); ctx.ellipse(-46, 22, 10, 6, 0, 0, Math.PI * 2); ctx.fillStyle = '#F59BA5'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(46, 22, 10, 6, 0, 0, Math.PI * 2); ctx.fill();

    ctx.beginPath(); ctx.roundRect(245, 195, 10, 12, 2); ctx.fillStyle = '#E0393B'; ctx.fill(); ctx.strokeStyle = '#8A1C1E'; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.restore();
  }

  function drawUpClouds(o) {
    const th = theme();
    for (const c of o.clouds) {
      let wob = 0, sc = c.s;
      if (c.real && o.hidden && o.hide < 0.45) wob = Math.sin(o.t * 50) * 4, sc *= 1 + (0.45 - o.hide) * 0.25;
      if (c.popped) sc *= 1 + Math.min(0.3, c.popped);
      const a = c.popped ? Math.max(0, 1 - c.popped / 0.6) : 1;
      if (a <= 0) continue;
      ctx.save(); ctx.globalAlpha = a;
      ctx.translate(c.x + wob, GROUND - c.h); ctx.scale(sc, sc);
      ctx.fillStyle = th.cloud;
      ctx.beginPath();
      ctx.ellipse(0, 0, 36, 15, 0, 0, Math.PI * 2);
      ctx.ellipse(-16, -6, 18, 14, 0, 0, Math.PI * 2);
      ctx.ellipse(14, -10, 20, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    if (L <= 6) { o.mode = L <= 2 ? 'still' : (L <= 4 ? 'sway' : 'bob'); o.x0 = W + 40 + nextGap * 0.5; o.x = o.x0; o.h = 95; }
    else if (L <= 8) {   // from the top-right corner straight down to the left edge
      o.mode = 'dropLeft'; o.x = W + 20; o.h = 235;
      const dur = 2.4 / slow; o.vx = -(W + 60) / dur; o.vh = -(235 - 10) / dur;
    } else {             // hides in one of three clouds, wobbles, then pops out toward Mai-chan
      o.mode = 'cloud'; o.hidden = true; o.hide = 1.1;
      const slots = [0.5, 0.68, 0.86].map(f => W * f + (Math.random() * 30 - 15));
      const real = Math.floor(Math.random() * 3);
      o.clouds = slots.map((x, i) => ({ x, h: 150 + Math.random() * 45, real: i === real, s: 0.9 + Math.random() * 0.3 }));
      const c = o.clouds[real];
      o.x = c.x; o.h = c.h;
      const T = 1.0 / slow, g = 260 * slow * slow, target = 160;
      o.g = g; o.vx = (MAI_X - c.x) / T; o.vh = (target - c.h + g * T * T / 2) / T;
      sendPartners(L, o.hide + T);
    }
    obs.push(o);
  }

  // Stage 9/10: a danger arrives right when the 1UP passes over Mai-chan.
  // A high bullet hits you if you jump for the 1UP too early; a ground thunder ball
  // catches you if you land too soon. Stage 9: one, from a random side (warning only
  // when it comes from behind). Stage 10: a bullet and a thunder ball, no warnings.
  const MAI_X = 135;
  function sendPartners(L, reach) {
    const rndSide = () => (Math.random() < 0.5 ? 1 : -1);   // 1 = from the right, -1 = from behind
    const picks = L >= 10 ? [['bullet', rndSide()], ['thunder', rndSide()]]
                          : [[Math.random() < 0.5 ? 'bullet' : 'thunder', rndSide()]];
    for (const [kind, side] of picks) {
      const warn = warnOK(L < 10 && side < 0) ? 0.5 : 0;
      if (kind === 'bullet') {
        const v = speed * 2.3, startX = side > 0 ? W + 30 : -30;
        const travel = Math.abs(startX - MAI_X) / v;
        const delay = Math.max(0, reach - 0.08 - warn - travel);
        pending.push({ at: delay, make: () => {
          obs.push({ type: 'bullet', x: startX, r: 8, h: 150, spin: 2.3, dir: -side, warn, t: 0, a: 0, partner: true });
          if (!warn) sfx.shot();
        } });
      } else {
        const v = speed * 3.6, startX = side > 0 ? W + 20 : -20;
        const travel = Math.abs(startX - MAI_X) / v;
        const delay = Math.max(0, reach + 0.5 - warn - travel);
        pending.push({ at: delay, make: () => {
          obs.push({ type: 'thunder', x: startX, r: 13, h: 0, vh: 0, zip: true, spin: 3.6, dir: -side, warn, side, t: 0, a: 0, partner: true });
          if (!warn) sfx.zap();
        } });
      }
    }
  }

  // round ice balls rain down in bursts; most are fast. They land ahead of Mai-chan and slide toward her.
  function iceStorm(dt) {
    iceT -= dt;
    const pr = spProg();
    if (iceT > 0 || pr >= 1 || pr < 0.1) return;
    const burst = pr < 0.35 ? 1 + Math.floor(Math.random() * 2) : pr < 0.7 ? 2 + Math.floor(Math.random() * 3) : 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < burst; i++) {
      pending.push({ at: i * (0.18 + Math.random() * 0.3), make: () => {
        const r = 7 + Math.random() * (6 + 10 * spProg());
        const fast = Math.random() < 0.3 + 0.5 * spProg();
        const fallT = fast ? 0.42 + Math.random() * 0.25 : 1.0 + Math.random() * 0.6;
        const landX = W * (0.48 + Math.random() * 0.48);
        const h0 = 300;
        obs.push({ type: 'ice', x: landX + 60, landX, r, h: h0, vf: h0 / fallT, vx: -60 / fallT, falling: true,
                   spin: 0.9 + Math.random() * 0.5, a: 0, t: 0, extra: true });
        sfx.tick();
      } });
    }
    iceT = (3.2 - 1.9 * pr) + Math.random() * (2.2 - 0.8 * pr);
  }

  function drawIce(o) {
    const cy = GROUND - o.r - o.h;
    if (o.falling) {   // shadow where it will land
      const k = Math.max(0.2, 1 - o.h / 300);
      ctx.fillStyle = 'rgba(40,90,130,' + (0.12 + 0.25 * k) + ')';
      ctx.beginPath(); ctx.ellipse(o.landX, GROUND + 3, o.r * (0.6 + k * 0.6), 3 + 3 * k, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.save(); ctx.translate(o.x, cy); ctx.rotate(o.a);
    ctx.beginPath(); ctx.arc(0, 0, o.r, 0, Math.PI * 2);
    ctx.fillStyle = '#BFE9FA'; ctx.fill(); ctx.strokeStyle = '#5FA9CC'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-o.r * 0.5, -o.r * 0.1); ctx.lineTo(o.r * 0.1, o.r * 0.5); ctx.moveTo(o.r * 0.2, -o.r * 0.6); ctx.lineTo(o.r * 0.55, -o.r * 0.1); ctx.stroke();
    ctx.restore();
    circ(o.x - o.r * 0.35, cy - o.r * 0.4, o.r * 0.28, 'rgba(255,255,255,0.85)');
  }

  function spawn() {
    const st = ST(), name = pick();
    let o;
    if (name === 'bullet') {
      const v = Math.random();
      let h = BOW_H, mult = 2.1;
      if (v < 0.18) mult = 3.0;              // fast
      else if (v < 0.36) h = 22;             // low
      else if (v < 0.54) h = 145;            // high: stay on the ground
      const warned = warnOK(st.bulletWarn !== false);
      o = { type: 'bullet', x: W + 30, r: 8, h, spin: mult, warn: warned ? 0.75 : 0, t: 0, a: 0 };
      if (!warned) sfx.shot();
    } else if (name === 'thunder') {
      // a thunder ball drops from the sky ahead of Mai-chan, then zips along the ground toward her
      const tw = warnOK(st.tWarn);
      o = { type: 'thunder', x: W * (0.72 + Math.random() * 0.16), r: 13, h: 330, vh: 0, zip: false,
            spin: st.tMult, warn: tw ? 0.7 : 0, t: 0, a: 0 };
      if (!tw) sfx.zap();
    } else if (name === 'mole') {
      const r = 20;
      const L = stageIdx + 1;
      o = { type: 'mole', x: W + 40, r, h: -2 * r, rise: 0, up: false, t: 0, a: 0, wait: 0, vh: 0,
            popX: DINO_X + 230 + Math.random() * 150,
            top: L <= 4 ? -r * 0.75 : 0,           // early: only the head peeks out
            hop: L >= 8, peak: L >= 10 ? 115 : 45 }; // late: it jumps out of the hole
    } else if (name === 'bomb') {
      const r = 17;
      const stopX = W * (0.62 + Math.random() * 0.2);
      const target = DINO_X + 150 + Math.random() * 200;
      o = { type: 'bomb', x: W + r + 10, r, h: 0, a: 0, spin: 1.7, t: 0, stopX, target,
            lit: false, fuse: 0, boom: 0, blast: r * 3.4 };
    } else {
      const kind = KIND[name];
      const r = kind.rMin + Math.random() * (kind.rMax - kind.rMin);
      let spin = kind.mult * (0.94 + Math.random() * 0.12);
      if (MODE.wild && !st.special) spin *= 1 + (Math.random() * 2 - 1) * 0.3 * (stageIdx / 9);   // speeds spread out more each stage
      o = { type: 'roll', kind, x: W + r * 2 + 10, r, a: 0, spin, t: Math.random() * 3, h: 0 };
      const L = stageIdx + 1;
      if (name === 'basket') {
        o.bounce = 22 + L * 6;                    // bounces higher on later stages
        o.h = Math.random() * o.bounce;
        o.vh = (Math.random() < 0.5 ? -1 : 1) * Math.sqrt(2 * 1800 * Math.max(1, o.bounce - o.h));
      } else if (name === 'soccer') {
        o.x0 = o.x; o.riseMax = 8 + L * 9;        // lifts off the ground as it comes
      } else if (name === 'baseball') {
        o.x0 = o.x; o.landX = DINO_X + 170 + Math.random() * 90;
        o.startH = 95 + Math.random() * 35; o.h = o.startH;
        o.p = 1 + L * 0.22;                       // drops later and sharper
        o.wob = L >= 5 ? (L - 4) * 5 : 0; o.wn = 2 + Math.floor(Math.random() * 3);
      } else if (name === 'volley') {
        const landX = DINO_X + 230 + Math.random() * 180;
        o.type = 'volley'; o.h = 260; o.x = landX + 260; o.vf = 330 + L * 14;
        sfx.fall();
      }
      if (name === 'earth' || name === 'saturn') {
        o.type = 'fall'; o.falling = true; o.bounces = 1;
        o.x = W * (0.6 + Math.random() * 0.25); o.h = 420; o.vh = 0;
        sfx.fall();
      }
    }
    obs.push(o);
    spawned++;
    const rr = o.type === 'bullet' ? 20 : o.r;
    const minGap = Math.max(250, speed * 0.78) * st.gap + rr * 2 + (o.type === 'fall' || o.type === 'volley' ? 140 : 0) + (o.type === 'bomb' ? 120 : 0);
    nextGap = minGap + Math.random() * speed * 0.8 * st.gap;
    if (st.special) nextGap *= 1.22 - 0.32 * spProg();
    if (o.type === 'thunder') nextGap += 160;
    if (MODE.wild && !st.special) {
      const lv = stageIdx / 9;   // 0 at stage 1 ... 1 at stage 10
      // irregular rhythm: sometimes a quick follow-up, sometimes a long breather
      nextGap = minGap * (1 - 0.22 * lv) + Math.random() * speed * (0.8 + 0.9 * lv) * st.gap;
      // near the end, two small rollers can come almost together; one long jump clears both
      if (stageIdx >= 7 && o.type === 'roll' && o.r <= 24 && !o.kind.bounce && spawned < stageN
          && Math.random() < 0.12 + 0.08 * (stageIdx - 7)) {
        const k2 = KIND[['rock', 'mikan', 'melon', 'dango'][Math.floor(Math.random() * 4)]];
        const r2 = Math.min(20, k2.rMin + Math.random() * (k2.rMax - k2.rMin));
        obs.push({ type: 'roll', kind: k2, x: o.x + o.r + r2 + 50 + Math.random() * 60, r: r2, a: 0, spin: o.spin, t: Math.random() * 3, h: 0 });
        spawned++;
        nextGap += 140;
      }
    }
    const plan = oneUpPlan.find(q => q.at === spawned && !q.sent);
    if (plan) { plan.sent = true; spawnOneUp(plan.k); }
  }

  // ---- collision ----
  function dinoCircles() {
    const baseY = GROUND + y;
    return HIT.map(([lx, ly, lr]) => [maiX() + lx * S, baseY + (ly - 332) * S, lr * S]);
  }
  function touches(cx, cy, cr, circles) {
    for (const [x, yy, r] of circles) {
      const dx = x - cx, dy = yy - cy;
      if (dx * dx + dy * dy < (r + cr) * (r + cr)) return true;
    }
    return false;
  }
  function checkHits() {
    const cs = dinoCircles();
    for (const o of obs) {
      if (o.gone) continue;
      if (o.type === 'oneup') {
        if (o.hidden) continue;
        if (touches(o.x, GROUND - o.h, o.r, cs)) {
          o.gone = true; lives++; sfx.oneup(); upTaken.add(o.stage);
          puffs.push({ text: '+1', x: o.x, y: GROUND - o.h, life: 0.9 });
        }
        continue;
      }
      if (o.type === 'bullet') {
        if (o.warn <= 0 && touches(o.x, GROUND - o.h, 7, cs)) return true;
        continue;
      }
      if (o.type === 'thunder') {
        if (o.warn <= 0 && touches(o.x, GROUND - o.r - o.h, o.r * 0.85, cs)) return true;
        continue;
      }
      if (o.type === 'bomb') {
        if (o.boom > 0) {
          if (o.boom < 0.3 && touches(o.x, GROUND - o.r, o.blast * Math.min(1, o.boom / 0.12) * 0.8, cs)) return true;
          continue;
        }
      }
      if (touches(o.x, GROUND - o.r - o.h, o.r * 0.85, cs)) return true;
    }
    return false;
  }

  function miss() {
    state = 'miss'; timer = 1.7; deadT = 0; stageMissed = true;
    if (!air) { vy = -420; air = true; holdT = HOLD_MAX; }   // a little bump before tipping over
    lives--;
    stopBgm(); sfx.miss();
    banner = { title: 'あいたっ！', sub: lives > 0 ? 'のこり ×' + lives : '', right: true };
  }
  function saveBest() {
    const s = score();
    let isNew = false;
    if (s > best) { best = s; isNew = true; try { localStorage.setItem(bestKey(modeKey), String(best)); } catch (e) {} }
    bestTop.textContent = 'ハイスコア（' + MODE.name + '） ' + best;
    return isNew;
  }
  function gameOver() {
    state = 'over'; banner = null;
    lockUntil = performance.now() + 600;
    sfx.over();
    const isNew = saveBest();
    showPanel(
      '<div class="big">ゲームオーバー</div>' +
      '<div class="hint">' + MODE.name + 'モード</div>' +
      '<div class="hint">ステージ ' + (stageIdx + 1) + ' まで進みました</div>' +
      '<div class="score">スコア ' + score() + '　／　ハイスコア ' + best + '</div>' +
      (isNew ? '<div class="new">ハイスコア更新！</div>' : '') + rankForm() +
      '<div class="hint"><kbd>スペース</kbd> か タップでモードえらびへ</div>');
    wireRankForm(stageIdx + 1);
  }
  // "next" button after a stage clear
  const nextBtn = document.getElementById('nextBtn');
  let waitNext = false;
  function goNext() {
    if (state !== 'clear' || !waitNext) return;
    waitNext = false; nextBtn.hidden = true; nextBtn.blur();
    if (isSpecial()) specialEnding();
    else if (stageIdx >= 9) ending();
    else { stageIdx++; stageMissed = false; startStage(); }
  }
  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); initAudio(); goNext(); });
  nextBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  function stageClear() {
    state = 'clear'; timer = 1.2; waitNext = false;
    const add = 100 * (stageIdx + 1);
    bonus += add;
    stopBgm(); sfx.clear();
    banner = { title: 'ステージクリア！', sub: 'ボーナス +' + add };
    if (!isSpecial() && !MODE.practice) {
      const silver = 10 * stageN, gold = 20 * stageN;
      const m = stageBonus >= gold && !stageMissed ? 3 : stageBonus >= silver ? 2 : 1;
      const before = allItems().filter(unlocked).map(it => it.n);
      const isNew = m > medals[stageIdx];
      if (isNew) { medals[stageIdx] = m; saveMedals(); }
      // lucky draw: easy 40%, normal 60%, hard 80%; after two misses in a row it always hits (so little ones are never left empty-handed)
      const fresh = [];
      const cands = allItems().filter(it => !unlocked(it) && eligible(it));
      if (cands.length) {
        const chance = { easy: 0.4, normal: 0.6, hard: 0.8 }[modeKey] || 0.4;
        if (missStreak >= 2 || Math.random() < chance) { const it = cands[Math.floor(Math.random() * cands.length)]; owned.add(it.id); fresh.push(it.n); missStreak = 0; }
        else missStreak++;
        saveOwned();
      }
      banner.medal = m;
      banner.title = MEDAL_NAME[m] + 'メダル！'; banner.isNew = isNew && m > 1;
      banner.sub = 'ステージ' + (stageIdx + 1) + ' クリア・ボーナス +' + add;
      banner.sub2 = fresh.length ? 'きせかえ「' + fresh[0] + '」ゲット！'
        : m === 3 ? 'すごい！ 小ジャンプの名人！'
        : m === 2 ? (stageBonus >= gold ? '金メダルは ノーミスで とれるよ' : '金メダルまで あと ' + (gold - stageBonus) + '点')
        : '銀メダルまで あと ' + (silver - stageBonus) + '点（小・中ジャンプで）';
      timer = fresh.length ? 1.8 : 1.4;
      if (m === 3 || fresh.length) setTimeout(() => sfx.oneup(), 500);
    }
  }
  function specialEnding() {
    state = 'ending'; banner = null;
    lockUntil = performance.now() + 800;
    stopBgm(); sfx.ending();
    const isNew = saveBest();
    showPanel(
      '<div class="big">伝説のマイちゃん！</div>' +
      '<div class="new">南極のスペシャルステージもクリアしました！</div>' +
      '<div class="score">スコア ' + score() + '　／　ハイスコア ' + best + '</div>' +
      (isNew ? '<div class="new">ハイスコア更新！</div>' : '') + rankForm() +
      '<div class="hint"><kbd>スペース</kbd> か タップでモードえらびへ</div>', true);
    wireRankForm(11);
  }

  function startSpecial() {
    overlay.hidden = true;
    stageIdx = SPECIAL; startStage();
  }

  function ending() {
    state = 'ending'; banner = null;
    lockUntil = performance.now() + 800;
    sfx.ending();
    const isNew = saveBest();
    showPanel(
      (modeKey === 'hard'
        ? '<div class="big">むずかしいモード クリア！</div><div class="new">マイちゃんが王冠をゲットしました！</div>'
        : '<div class="big">マイちゃん、ぜんぶクリア！</div><div class="hint">' + MODE.name + 'モードの10ステージを、ぜんぶよけきりました。おつかれさま！</div>') +
      '<div class="score">スコア ' + score() + '　／　ハイスコア ' + best + '</div>' +
      (isNew ? '<div class="new">ハイスコア更新！</div>' : '') + rankForm() +
      (modeKey === 'hard'
        ? '<div class="hint" style="margin-top:4px">さらにむずかしい スペシャルステージにチャレンジしますか？</div>' +
          '<div class="challenge"><button type="button" class="mode hard" data-sp="yes">チャレンジする！</button><button type="button" class="mode normal" data-sp="no">やめておく</button></div>'
        : '<div class="hint"><kbd>スペース</kbd> か タップでモードえらびへ</div>'), true);
    const yes = panel.querySelector('[data-sp="yes"]'), no = panel.querySelector('[data-sp="no"]');
    if (yes) yes.addEventListener('click', (e) => { e.stopPropagation(); initAudio(); startSpecial(); });
    if (no) no.addEventListener('click', (e) => { e.stopPropagation(); showTitle(); });
    wireRankForm(10);
  }

  // ---- update obstacles ----
  function rollMotion(o, dt) {
    const n = o.kind.name;
    if (n === 'basket') {
      o.vh -= 1800 * dt; o.h += o.vh * dt;
      if (o.h <= 0) { o.h = 0; o.vh = Math.sqrt(2 * 1800 * o.bounce); }
    } else if (n === 'soccer') {
      const pr = Math.min(1.25, Math.max(0, (o.x0 - o.x) / (o.x0 - DINO_X - 60)));
      o.h = o.riseMax * pr;
    } else if (n === 'baseball') {
      const pr = Math.min(1, Math.max(0, (o.x0 - o.x) / (o.x0 - o.landX)));
      o.h = Math.max(0, o.startH * (1 - Math.pow(pr, o.p)) + o.wob * Math.sin(pr * Math.PI * o.wn) * (1 - pr));
    } else if (o.vh) {
      o.vh -= 1800 * dt; o.h += o.vh * dt;
      if (o.h <= 0) { o.h = 0; o.vh = 0; }
    } else o.h = 0;
  }

  function updateObstacles(dt) {
    for (const o of obs) if (o.type === 'ice') {
      if (o.falling) {
        o.h -= o.vf * dt; o.x += o.vx * dt;
        if (o.h <= 0) { o.h = 0; o.falling = false; o.x = o.landX; sfx.thud(); }
      } else { o.x -= speed * o.spin * dt; o.a -= speed * o.spin * dt / o.r; }
    }
    for (const q of pending) { q.at -= dt; if (q.at <= 0 && !q.done) { q.done = true; q.make(); } }
    pending = pending.filter(q => !q.done);
    for (const o of obs) {
      o.t += dt;
      if (o.type === 'roll' || (o.type === 'fall' && !o.falling)) {
        o.x -= speed * o.spin * dt;
        o.a -= (speed * o.spin * dt) / o.r;
        rollMotion(o, dt);
      } else if (o.type === 'volley') {
        o.x -= o.vf * dt; o.h -= o.vf * dt; o.a -= (o.vf * dt) / o.r;
        o.shadowX = o.x - o.h;
        if (o.h <= 0) { o.h = 0; o.type = 'roll'; o.spin = 1; o.vh = 240; sfx.thud(); }
      } else if (o.type === 'fall') {
        o.vh -= 1500 * dt; o.h += o.vh * dt;
        o.x -= speed * 0.2 * dt;
        if (o.h <= 0) {
          o.h = 0;
          if (o.bounces > 0) { o.vh = -o.vh * 0.33; o.bounces--; sfx.thud(); squashCam = 0.6; }
          else o.falling = false;
        }
      } else if (o.type === 'thunder') {
        if (o.warn > 0) { o.warn -= dt; if (o.warn <= 0) sfx.zap(); }
        else if (!o.zip) {
          o.vh += 2600 * dt; o.h -= o.vh * dt; o.x -= speed * 0.3 * dt;
          if (o.h <= 0) { o.h = 0; o.zip = true; squashCam = 0.5; sfx.thud(); }
        } else o.x += (o.dir || -1) * speed * o.spin * dt;
      } else if (o.type === 'bullet') {
        if (o.warn > 0) { o.warn -= dt; if (o.warn <= 0) sfx.shot(); }
        else o.x += (o.dir || -1) * speed * o.spin * dt;
      } else if (o.type === 'bomb') {
        if (o.boom > 0) {
          o.boom += dt; o.x -= speed * dt;
          if (o.boom > 0.45) o.gone = true;
        } else if (!o.lit) {
          o.x -= speed * o.spin * dt; o.a -= (speed * o.spin * dt) / o.r;
          if (o.x <= o.stopX) {
            o.lit = true;
            o.fuse = Math.max(0.7, (o.x - o.target) / speed);
            o.a = ((o.a % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
          }
        } else {
          o.x -= speed * dt;
          o.a *= Math.pow(0.002, dt);
          const before = o.fuse;
          o.fuse -= dt;
          if (Math.floor(before * 4) !== Math.floor(o.fuse * 4)) sfx.tick();
          if (o.fuse <= 0) { o.boom = 0.001; sfx.boom(); squashCam = 1; }
        }
      } else if (o.type === 'mole') {
        o.x -= speed * dt;
        if (!o.up && o.x <= o.popX) {
          o.up = true; sfx.pop();
          if (o.hop) o.vh = Math.sqrt(2 * 1800 * (o.peak + 2 * o.r));
        }
        if (o.up && o.hop) {
          if (o.wait > 0) o.wait -= dt;
          else {
            o.vh -= 1800 * dt; o.h += o.vh * dt;
            if (o.h <= -2 * o.r) { o.h = -2 * o.r; o.wait = 0.35; o.vh = Math.sqrt(2 * 1800 * (o.peak + 2 * o.r)); }
          }
        } else if (o.up) {
          o.rise = Math.min(1, o.rise + dt / 0.22);
          o.h = -2 * o.r + (o.top + 2 * o.r) * o.rise + (o.rise >= 1 ? Math.sin(o.t * 8) * 1.5 : 0);
        }
      } else if (o.type === 'oneup') {
        if (o.mode === 'still') { o.x0 -= speed * dt; o.x = o.x0; o.h = 95 + Math.sin(o.t * 4) * 4; }
        else if (o.mode === 'sway') { o.x0 -= speed * dt; o.x = o.x0 + Math.sin(o.t * 3.2) * 55; o.h = 95; }
        else if (o.mode === 'bob') { o.x0 -= speed * dt; o.x = o.x0; o.h = 100 + Math.sin(o.t * 2.6) * 60; }
        else if (o.mode === 'cloud') {
          for (const c of o.clouds) c.x -= speed * 0.12 * dt;
          if (o.hidden) {
            o.hide -= dt;
            const c = o.clouds.find(k => k.real); o.x = c.x;
            if (o.hide <= 0) { o.hidden = false; sfx.pop(); c.popped = 0.001; }
          } else {
            o.vh -= o.g * dt; o.x += o.vx * dt; o.h += o.vh * dt;
            if (o.x < -40 || o.h < -30) o.gone = true;
          }
          for (const c of o.clouds) if (c.popped) c.popped += dt;
        }
        else {
          o.x += o.vx * dt; o.h += o.vh * dt;
          if (o.mode === 'dropRight' && o.x >= W / 2) {
            o.gone = true;
            for (let i = 0; i < 6; i++) puffs.push({ x: o.x + Math.random() * 20 - 10, y: GROUND - o.h + Math.random() * 20 - 10, vx: Math.random() * 60 - 30, r: 4, life: 0.4 });
          }
        }
      }
    }
    // a faster thing waits behind a slower one instead of passing through it
    const ground = obs.filter(o => (o.type === 'roll' || (o.type === 'fall' && !o.falling) || (o.type === 'bomb' && !o.boom) || o.type === 'mole') && !o.gone);
    ground.sort((p, q) => p.x - q.x);
    for (let i = 1; i < ground.length; i++) {
      const need = ground[i - 1].r + ground[i].r + 6;
      if (ground[i].x - ground[i - 1].x < need) ground[i].x = ground[i - 1].x + need;
    }
    // remove what left the screen
    for (const o of obs) {
      if (!o.gone && (o.x < -90 || (o.dir > 0 && o.x > W + 90))) o.gone = true;
      if (o.gone && !o.counted) { o.counted = true; if (o.type !== 'oneup' && !o.extra) passed++; }
    }
    obs = obs.filter(o => !o.gone);
  }

  // ---- loop ----
  let wind = 0, windTarget = 0, windT = 0, maiDX = 0, iceT = 0;
  const maiX = () => DINO_X + maiDX;
  let last = performance.now(), squashCam = 0, deadT = 0;
  function frame(nowMs) {
    const dt = Math.min(0.033, (nowMs - last) / 1000);
    last = nowMs;
    const st = ST();
    const moving = state === 'play' || state === 'intro' || state === 'clear';
    const sp = moving ? speed : (state === 'title' ? 120 : 0);

    if (state === 'play') {
      speed = (st.base + (st.max - st.base) * Math.min(1, spawned / stageN)) * (st.special ? 1 : MODE.speed);
      dist += speed * dt;
      if (spawned < stageN || MODE.practice) {
        nextGap -= speed * dt;
        if (nextGap <= 0) spawn();
        // practice: every 20 obstacles the next stage's obstacles take over (up to stage 10)
        if (MODE.practice && spawned >= PRACTICE_STEP && stageIdx < 9) { stageIdx++; spawned = 0; }
      }
      updateObstacles(dt);
      const m = Math.floor(score() / 100);
      if (m > milestone) { milestone = m; sfx.chime(); }
      if (MODE.practice) {
        pr.inv = Math.max(0, pr.inv - dt);
        if (pr.inv <= 0 && checkHits()) {
          pr.hits++; pr.inv = 1.0; sfx.thud();
          puffs.push({ text: 'あたった！', x: maiX() + 240, y: GROUND - 80, life: 0.9 });
        }
      }
      else if (checkHits()) miss();
      else if (spawned >= stageN && obs.every(o => o.type === 'oneup' || o.extra) && !pending.length) stageClear();
      if (isSpecial()) iceStorm(dt);
    } else if (state === 'intro') {
      timer -= dt;
      if (timer <= 0) { state = 'play'; banner = null; }
    } else if (state === 'clear') {
      updateObstacles(dt);
      timer -= dt;
      if (timer <= 0 && !waitNext) {
        // stay here until the player taps, so there is time to look at the medal and new dress-up items
        waitNext = true;
        nextBtn.textContent = isSpecial() || stageIdx >= 9 ? 'つぎにすすむ ▶' : 'つぎのステージへ ▶';
        nextBtn.hidden = false;
      }
    } else if (state === 'miss') {
      timer -= dt;
      if (timer <= 0) {
        if (lives > 0) { if (MODE.restart && !isSpecial()) { stageIdx = 0; stageMissed = false; } startStage(); }
        else gameOver();
      }
    }

    // special stage: gusts of wind push Mai-chan while she is in the air; on the ice she slides back slowly
    if (isSpecial() && (state === 'play' || state === 'intro')) {
      windT -= dt;
      if (windT <= 0) { const pr = spProg(); windTarget = (Math.random() * 2 - 1) * (60 + 180 * pr); windT = (2.6 - 1.3 * pr) + Math.random() * 2; }
      wind += (windTarget - wind) * Math.min(1, dt * 2.5);
      if (air) maiDX += wind * dt * 0.75;
      else maiDX -= maiDX * Math.min(1, dt * 0.9);
      maiDX = Math.max(-36, Math.min(80, maiDX));
    }
    // dino physics (keeps running except while paused)
    if (air && state !== 'pause') {
      let g = GRAV;
      if (holding && vy < 0 && holdT < HOLD_MAX) { g *= 0.35; holdT += dt; }
      vy += g * dt; y += vy * dt;
      if (y >= 0) {
        y = 0; vy = 0; air = false; squash = 0.09;
        if (state !== 'miss') {
          const rk = holdT / HOLD_MAX, k = rk >= 0.8 ? 'l' : rk >= 0.25 ? 'm' : 's';
          landLock = landLockFor(k);
          if (k === 'l') squash = 0.16;
          // score bonus for what she cleared with this jump (not in practice)
          if (!MODE.practice && jumpedOver > 0 && JUMP_BONUS[k] && state === 'play') {
            const add = JUMP_BONUS[k] * jumpedOver;
            bonus += add; stageBonus += add;
            puffs.push({ text: (k === 's' ? 'ナイス小ジャンプ！ +' : '中ジャンプ +') + add, x: maiX() + 230, y: GROUND - 120, life: 0.9 });
          }
          jumpedOver = 0;
        }
        if (state !== 'miss') {   // landing sound grows with the jump: small / middle / big "ボスン"
          const r = holdT / HOLD_MAX;
          if (r >= 0.8) { sfx.landL(); squashCam = Math.max(squashCam, 0.45); } else if (r >= 0.25) sfx.landM(); else sfx.land();
          if (MODE.practice && state === 'play') {
            const k = r >= 0.8 ? 'l' : r >= 0.25 ? 'm' : 's';
            pr[k]++;
            puffs.push({ text: { s: '小ジャンプ', m: '中ジャンプ', l: '大ジャンプ！' }[k], x: maiX() + 240, y: GROUND - 120, life: 0.9 });
          }
        }
        for (let i = 0; i < 5; i++) puffs.push({ x: maiX() + 60 + Math.random() * 70, y: GROUND - 3, vx: -60 - Math.random() * 80, r: 4 + Math.random() * 4, life: 0.4 });
      }
    }
    {
      const showPz = state === 'play' || state === 'intro';
      if (pauseBtn.hidden === showPz) pauseBtn.hidden = !showPz;
      const showSnd = state === 'title';
      if (soundBtn.hidden === showSnd) soundBtn.hidden = !showSnd;
      const tp = Math.round(6 + hudDrop * canvas.clientHeight / H) + 'px';
      if (pauseBtn.style.top !== tp) pauseBtn.style.top = tp;
    }
    if (moving || state === 'title') phase += dt * (8 + sp / 60);
    squash *= Math.pow(0.0005, dt);
    if (landLock > 0) {
      landLock -= dt;
      squash = Math.max(squash, 0.07);   // she stays crouched while she can't jump yet
      if (landLock <= 0 && jumpQueued && (state === 'play' || state === 'intro' || state === 'clear')) {
        jumpQueued = false; startJump();
        if (!holding) vy *= 0.55;          // a tap made during the landing still gives a small hop
      }
    }
    if (landLock <= 0) jumpQueued = false;
    // count what passes under her while she is in the air
    if (air && state === 'play') for (const o of obs) {
      if (o.over || o.gone || o.type === 'oneup' || o.extra || (o.warn > 0)) continue;
      if (o.x < maiX() + 75 && o.x > maiX() - 60) { o.over = true; jumpedOver++; }
    }
    squashCam *= Math.pow(0.001, dt);
    if (state === 'miss') deadT += dt;
    hillOff += sp * 0.3 * dt;
    pumpBgm();

    // ---- draw ----
    ctx.save();
    if (squashCam > 0.02) ctx.translate((Math.random() - 0.5) * 6 * squashCam, (Math.random() - 0.5) * 6 * squashCam);
    drawScenery(dt, sp);
    for (const p of puffs) {
      p.life -= dt;
      if (p.text) {
        p.y -= 40 * dt;
        ctx.globalAlpha = Math.max(0, p.life / 0.9);
        ctx.fillStyle = '#2C6A1E'; ctx.font = '900 20px ' + FONT; ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
      } else {
        p.x += p.vx * dt; p.r += 10 * dt;
        ctx.globalAlpha = Math.max(0, p.life / 0.4) * 0.8;
        circ(p.x, p.y, p.r, '#F3F7EC');
      }
    }
    ctx.globalAlpha = 1;
    puffs = puffs.filter(p => p.life > 0);
    for (const o of obs) if ((o.type === 'fall' && o.falling) || o.type === 'volley') drawFallShadow(o);
    for (const o of obs) {
      if (!((o.type === 'roll' || (o.type === 'fall' && !o.falling) || (o.type === 'bomb' && !o.boom) || (o.type === 'ice' && !o.falling)) && o.r)) continue;
      const k = Math.max(0.3, 1 - (o.h || 0) / 160);
      ctx.fillStyle = 'rgba(30,50,15,' + (0.22 * k) + ')';
      ctx.beginPath(); ctx.ellipse(o.x + 3, GROUND + 3, o.r * 1.05 * k, 4.5 * k, 0, 0, Math.PI * 2); ctx.fill();
    }
    for (const o of obs) {
      if (o.type === 'bullet' || o.type === 'thunder') continue;
      if (o.type === 'ice') { drawIce(o); continue; }
      if (o.type === 'bomb') drawBomb(o);
      else if (o.type === 'oneup') { drawOneUp(o); if (o.mode === 'cloud' && !o.hidden) drawUpClouds(o); }
      else if (o.type === 'mole') drawMole(o);
      else drawObstacle(o);
    }
    const sh = Math.max(0.35, 1 + y / 200);
    ctx.fillStyle = 'rgba(46,80,20,0.22)';
    ctx.beginPath(); ctx.ellipse(maiX() + 75, GROUND + 3, 62 * sh, 6 * sh, 0, 0, Math.PI * 2); ctx.fill();
    const dead = state === 'miss' || state === 'over';
    const fp = state === 'over' ? 1 : (state === 'miss' ? Math.min(1, deadT / 0.45) : 0);
    const fall = fp ? 1 - Math.pow(1 - fp, 3) : 0;
    if (state === 'ending' && modeKey === 'hard') crownOn = true; else if (state !== 'ending') crownOn = false;
    if (MODE.practice && pr.inv > 0 && Math.floor(pr.inv * 10) % 2 === 0) ctx.globalAlpha = 0.35;
    drawDino(maiX(), GROUND + y, S, dead ? null : (state === 'pause' ? null : phase), air && !dead, squash, dead, fall);
    ctx.globalAlpha = 1;
    if (crownOn && outfit.head !== 'crown') {
      ctx.save(); ctx.translate(maiX() + 200 * S, GROUND + y + (14 - 332) * S); ctx.rotate(-0.12);
      ctx.fillStyle = '#FFD23F'; ctx.strokeStyle = '#B07A00'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(-20, 8); ctx.lineTo(-22, -12); ctx.lineTo(-11, -2); ctx.lineTo(0, -18); ctx.lineTo(11, -2); ctx.lineTo(22, -12); ctx.lineTo(20, 8); ctx.closePath();
      ctx.fill(); ctx.stroke();
      circ(0, -18, 3.5, '#E0393B'); circ(-22, -12, 3, '#3E8DD8'); circ(22, -12, 3, '#3E8DD8');
      ctx.restore();
    }
    for (const o of obs) if (o.type === 'bullet') drawBullet(o);
    for (const o of obs) if (o.type === 'thunder') drawThunder(o);
    drawWeather(dt, sp);
    ctx.restore();

    ctx.save(); ctx.translate(0, hudDrop); drawHud(); ctx.restore();
    if (banner) drawBanner();
    requestAnimationFrame(frame);
  }

  function drawHud() {
    const th = theme();
    if (state === 'title' || state === 'ending' || state === 'wardrobe' || state === 'pv' || state === 'rank') return;   // the ending card shows the score; keep the crown clear
    if (MODE.practice) return;   // practice shows only the jump names when landing
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left'; ctx.fillStyle = th.hud;
    ctx.font = '900 20px ' + FONT;
    const stageLabel = isSpecial() ? 'ステージ ★' : 'ステージ ' + (stageIdx + 1);
    ctx.fillText(stageLabel, 16, 32);
    const left = Math.max(0, stageN - passed);
    ctx.font = '700 15px ' + FONT; ctx.fillStyle = th.hudSoft;
    ctx.fillText('のこり ' + left + 'こ', 16 + ctx.measureText(stageLabel).width * 20 / 15 + 12, 31);
    // lives: tiny dinos
    const shown = Math.min(lives, 5);
    for (let i = 0; i < shown; i++) drawDino(14 + i * 30, 66, 0.085, null, false, 0, false);
    if (lives > 5 || shown > 0) {
      ctx.font = '700 15px ' + FONT; ctx.fillStyle = th.hud;
      ctx.fillText('×' + lives, 16 + shown * 30, 60);
    }
    ctx.textAlign = 'right';
    ctx.font = '700 20px ' + FONT; ctx.fillStyle = th.hud;
    ctx.fillText('スコア ' + String(score()).padStart(5, '0'), W - 16, 32);
    ctx.font = '500 13px ' + FONT; ctx.fillStyle = th.hudSoft;
    ctx.fillText('ハイスコア ' + String(best).padStart(5, '0'), W - 16, 52);
  }

  function drawBanner() {
    if (banner.medal) return drawMedalBanner();
    const w = Math.min(W - 40, banner.right ? 300 : 360), h = banner.sub ? 92 : 64, yy = 92;
    const x = banner.right ? W - w - 20 : (W - w) / 2;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.93)'; ctx.strokeStyle = '#3B5512'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(x, yy, w, h, 16); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#23401A'; ctx.font = '900 30px ' + FONT;
    ctx.fillText(banner.title, x + w / 2, yy + (banner.sub ? 34 : h / 2));
    if (banner.sub) { ctx.font = '700 17px ' + FONT; ctx.fillStyle = '#4F6A44'; ctx.fillText(banner.sub, x + w / 2, yy + 66); }
    ctx.restore();
  }

  function drawMedalBanner() {
    const w = Math.min(W - 30, 430), h = 116, yy = 70, x = (W - w) / 2;
    const col = [null, ['#E3A46E', '#9C5B26'], ['#E4E8EE', '#8C96A3'], ['#FFD84D', '#B88A00']][banner.medal];
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.strokeStyle = '#3B5512'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(x, yy, w, h, 16); ctx.fill(); ctx.stroke();
    // the medal
    const mx = x + 50, my = yy + h / 2, sh = performance.now() / 300;
    ctx.fillStyle = '#E0393B'; ctx.beginPath(); ctx.moveTo(mx - 14, my - 46); ctx.lineTo(mx - 4, my - 18); ctx.lineTo(mx + 4, my - 18); ctx.lineTo(mx + 14, my - 46); ctx.fill();
    circ(mx, my + 4, 26, col[0], col[1], 3);
    circ(mx, my + 4, 18, null, col[1], 1.5);
    ctx.fillStyle = col[1]; ctx.font = '900 18px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(MEDAL_NAME[banner.medal], mx, my + 5);
    if (banner.medal === 3) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(sh * 2); circ(mx - 10, my - 6, 3, '#FFFFFF'); ctx.globalAlpha = 1; }
    const tx = x + 92 + (w - 100) / 2;
    ctx.fillStyle = '#23401A'; ctx.font = '900 26px ' + FONT; ctx.fillText(banner.title, tx, yy + 28);
    ctx.font = '700 15px ' + FONT; ctx.fillStyle = '#4F6A44'; ctx.fillText(banner.sub, tx, yy + 60);
    ctx.font = '900 15px ' + FONT; ctx.fillStyle = '#B4501F'; ctx.fillText(banner.sub2, tx, yy + 88);
    if (banner.isNew) { ctx.save(); ctx.translate(x + w - 34, yy + 10); ctx.rotate(0.18); ctx.fillStyle = '#E2462F'; ctx.beginPath(); ctx.roundRect(-30, -12, 60, 24, 12); ctx.fill(); ctx.fillStyle = '#FFFFFF'; ctx.font = '900 13px ' + FONT; ctx.fillText('きろく！', 0, 1); ctx.restore(); }
    ctx.restore();
  }

  // ---- sizing ----
  let hudDrop = 0;   // moves the score text down when the game reaches under the viewer's buttons
  function resize() {
    const bw = (parseFloat(getComputedStyle(stage).borderLeftWidth) || 0) * 2;
    const availW = stage.parentElement.clientWidth - bw;
    const vh = window.innerHeight;
    const compact = window.innerWidth > vh && vh <= 520;   // phone held sideways
    let cssW, cssH;
    if (compact) {
      // fill the space that is really visible (the viewer may keep room for its own buttons);
      // everything keeps its size, you just see a little further ahead
      const pf = (v) => parseFloat(v) || 0;
      const rcs = getComputedStyle(document.documentElement), bcs = getComputedStyle(document.body);
      const seen = Math.min(window.innerHeight, (window.visualViewport && window.visualViewport.height) || Infinity);
      // the space the viewer keeps at the top only holds two small corner buttons,
      // so the game reaches up into it and just the score text moves down out of their way
      const padTop = pf(rcs.paddingTop);
      stage.parentElement.style.marginTop = (-padTop) + 'px';
      cssH = seen - pf(rcs.paddingBottom) - pf(bcs.paddingTop) - pf(bcs.paddingBottom) - bw;
      cssH = Math.max(120, cssH);
      cssW = Math.min(availW, cssH * 2.25);                 // no wider than a phone screen, so it never looks stretched out
      W = Math.round(H * cssW / cssH);
      hudDrop = Math.min(padTop, 66) * H / cssH;
    } else {
      // upright phones and computers: the same 2:1 game screen
      stage.parentElement.style.marginTop = '';
      hudDrop = 0;
      cssW = Math.min(availW, 900); cssH = cssW / 2;
      const maxH = Math.max(200, vh * 0.62);
      if (cssH > maxH) { cssH = maxH; cssW = cssH * 2; }
      W = H * 2;
    }
    cssW = Math.round(cssW); cssH = Math.round(cssH);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    stage.style.width = (cssW + bw) + 'px';
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    makeScenery();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---- input ----
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (state === 'title' && ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Numpad1', 'Numpad2', 'Numpad3', 'Numpad4'].includes(e.code)) {
      chooseMode(['easy', 'normal', 'hard', 'practice'][Number(e.code.slice(-1)) - 1]); return;
    }
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (!e.repeat) jumpPress();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') jumpRelease();
  });
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, input')) return;
    e.preventDefault(); stage.focus({ preventScroll: true }); jumpPress();
  });
  document.getElementById('tapzone').addEventListener('pointerdown', (e) => { e.preventDefault(); jumpPress(); });
  // upright phone: during play, a tap anywhere on the page (outside the game screen too) makes her jump
  const MENU_STATES = ['title', 'over', 'ending', 'pause', 'wardrobe', 'pv', 'rank'];
  document.addEventListener('pointerdown', (e) => {
    if (stage.contains(e.target) || e.target.closest('button, a, input, select, textarea')) return;
    if (window.innerHeight <= window.innerWidth || MENU_STATES.includes(state)) return;
    e.preventDefault(); jumpPress();
  });
  document.documentElement.style.touchAction = 'manipulation';
  document.addEventListener('selectstart', (e) => { if (!(e.target && e.target.closest && e.target.closest('input'))) e.preventDefault(); });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('pointerup', jumpRelease);
  window.addEventListener('pointercancel', jumpRelease);
  stage.addEventListener('contextmenu', (e) => e.preventDefault());

  requestAnimationFrame((t) => { last = t; frame(t); });

  // offline play: keep the game files on the phone after the first visit
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
})();
</script>
